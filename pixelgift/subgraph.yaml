specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PixelERC20
    network: base-sepolia
    source:
      address: "0xf875AA3EE0Cc060C5D06813dBD5c78DeC553411A"
      abi: PixelERC20
      startBlock: 30601048
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - BoxAdded
        - BoxClaimed
        - EIP712DomainChanged
        - OwnershipTransferred
        - Transfer
      abis:
        - name: PixelERC20
          file: ./abis/PixelERC20.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: BoxAdded(uint16)
          handler: handleBoxAdded
        - event: BoxClaimed(address,uint16,uint16)
          handler: handleBoxClaimed
        - event: EIP712DomainChanged()
          handler: handleEIP712DomainChanged
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/pixel-erc-20.ts
